[functions.consultor-financeiro]
enabled = true
verify_jwt = true
import_map = "./functions/consultor-financeiro/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/consultor-financeiro/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/consultor-financeiro/*.html" ]

[functions.chat-financeiro]
enabled = true
verify_jwt = true
entrypoint = "./functions/chat-financeiro/index.ts"

[functions.telegram-bot]
enabled = true
# O Telegram não envia JWT; a segurança vem do header X-Telegram-Bot-Api-Secret-Token (TELEGRAM_WEBHOOK_SECRET).
verify_jwt = false
import_map = "./functions/telegram-bot/deno.json"
entrypoint = "./functions/telegram-bot/index.ts"
