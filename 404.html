<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Controle Financeiro</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (spa-github-pages, MIT).
      // Converte /controle-financeiro/metas em /controle-financeiro/?/metas e o index.html restaura a URL.
      // pathSegmentsToKeep = 1 preserva o segmento do repositório (base "/controle-financeiro/").
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
